worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    default_type text/plain;
    log_format subsite_monitor '$time_iso8601 $host $remote_addr "$request" $status';
    access_log /var/log/nginx/access.log subsite_monitor;
    include conf.d/*.conf;
}
