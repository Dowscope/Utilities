worker_processes 1;

events {
    worker_connections 128;
}

http {
    include conf.d/*.conf;

    server {
        listen 80;
        server_name Root.Example.test root-alias.example.test;

        location / {
            # This isn't valid in a location block and isn't a site name.
            server_name ignored.example.test;
        }
    }
}
